name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - agent/v0.3-combat-depth
      - agent/admin-total-balance-controls

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run game and contract tests
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Last 100 test-output lines"
            tail -n 100 test-output.txt
            echo "::endgroup::"
            exit "$status"
          fi
          cat test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Compile production contracts
        run: npm run contracts:compile
