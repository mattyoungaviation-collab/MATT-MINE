name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - agent/v0.3-combat-depth

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run game and contract tests
        run: npm test

      - name: Compile production contracts
        run: npm run contracts:compile
