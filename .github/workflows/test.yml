name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - agent/v0.3-combat-depth

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run game and contract tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nugget-economy-test-output
          path: test-output.log
          if-no-files-found: error
          retention-days: 1

      - name: Compile production contracts
        run: npm run contracts:compile
