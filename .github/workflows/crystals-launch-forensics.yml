name: CRYSTALS launch forensics

on:
  push:
    branches: [forensics/crystals-20260808]
    paths-ignore: ['forensics-output/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forensics/crystals-20260808
      - name: Analyze launch
        shell: bash
        run: |
          cat > /tmp/analyze.py <<'PY'
          import csv,json,time,urllib.parse,urllib.request
          from collections import defaultdict,deque
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from datetime import datetime,timezone

          API='https://api.dexpaprika.com'; RPC='https://api.roninchain.com/rpc'
          START=int(datetime(2026,8,8,0,0,tzinfo=timezone.utc).timestamp())
          END=int(datetime(2026,8,9,12,0,tzinfo=timezone.utc).timestamp())
          CR='0x2d2034e55900d285dc05d30a0c14846d7a30285b'; MATT='0xa5450417bdca0bdfb058ffe41205400ffda1174d'
          USDC='0x0b7007c13325c48911f73a2dad5fa5dcbf808adc'; WRON='0xe514d9deb7966c8be0ca922de8a064264ea6bcd4'
          OWNER={'0xf79913cb83cc9cabd95d0ba9250103fbb939f984','0x1dab596d0121c250a24b00137e84170fa6874be6'}
          POOLS={'CM':'0x0cbe4dc4087307ef3ce4edcfa7ee85eab7c61255','CU1':'0x93df886238beeaa9cad27c12a9465ad5183d10f3','CU2':'0xc0206b9a7822591a9355af520590d39f2d526290','MR':'0xa517e05e96728e80284f2ae157ddf309449d7ce8','MU':'0x415c997ce1adcfea7b3ac8949ff4220749ad7dc6'}
          CRPOOLS={'CM','CU1','CU2'}; TOPIC='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'

          def http_json(url,data=None):
            last=None
            for n in range(6):
              try:
                h={'User-Agent':'matt-crystals-forensics/1.0','Accept':'application/json'}
                if data is not None: h['Content-Type']='application/json'
                q=urllib.request.Request(url,data=data,headers=h,method='POST' if data is not None else 'GET')
                with urllib.request.urlopen(q,timeout=35) as r:return json.loads(r.read())
              except Exception as e:last=e;time.sleep(.5*(n+1))
            raise last

          def fetch_pool(name,address):
            out=[];seen=set();page=0
            while page<50:
              qs=urllib.parse.urlencode({'limit':100,'page':page,'from':START,'to':END})
              d=http_json(f'{API}/networks/ronin/pools/{address}/transactions?{qs}')
              txs=d.get('transactions') or [];new=0
              for x in txs:
                k=(x.get('id'),x.get('log_index'),x.get('pool_id'))
                if k not in seen:
                  seen.add(k);y=dict(x);y['_pool']=name;out.append(y);new+=1
              print('POOL',name,'page',page,'rows',len(txs),'new',new,'info',d.get('page_info'),flush=True)
              if not txs or not new or len(txs)<100:break
              page+=1
            return out

          rows=[];counts={}
          for n,a in POOLS.items():
            try:r=fetch_pool(n,a)
            except Exception as e:print('POOL_ERROR',n,repr(e),flush=True);r=[]
            counts[n]=len(r);rows+=r
          byhash=defaultdict(list)
          for r in rows:byhash[(r.get('id') or '').lower()].append(r)
          hashes=sorted({h for h,rs in byhash.items() if any(r['_pool'] in CRPOOLS for r in rs)})

          def rpc(method,params):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
            d=http_json(RPC,body)
            if d.get('error'):raise RuntimeError(d['error'])
            return d.get('result')
          def resolve(h):
            try:return h,rpc('eth_getTransactionByHash',[h]),rpc('eth_getTransactionReceipt',[h]),''
            except Exception as e:return h,None,None,str(e)
          chain={}
          with ThreadPoolExecutor(max_workers=5) as ex:
            fs=[ex.submit(resolve,h) for h in hashes]
            for i,f in enumerate(as_completed(fs),1):
              h,t,r,e=f.result();chain[h]=(t,r,e)
              if i%50==0 or i==len(fs):print('RPC',i,'/',len(fs),flush=True)

          def side(r,tok):
            tok=tok.lower()
            for i in (0,1):
              if (r.get(f'token_{i}') or '').lower()==tok:
                raw=int(r.get(f'amount_{i}') or 0);vol=float(r.get(f'volume_{i}') or 0);px=float(r.get(f'price_{i}_usd') or 0)
                return raw,vol,px
            return 0,0.0,0.0
          def signed(r,tok):
            raw,v,_=side(r,tok);return v if raw>0 else -v if raw<0 else 0.0
          def price(r,tok):return side(r,tok)[2]
          def wallet_delta(receipt,wallet,token,decimals):
            if not receipt or not wallet:return 0.0
            ans=0.0;wallet=wallet.lower();token=token.lower()
            for lg in receipt.get('logs') or []:
              ts=lg.get('topics') or []
              if (lg.get('address') or '').lower()!=token or len(ts)<3 or (ts[0] or '').lower()!=TOPIC:continue
              fr='0x'+ts[1][-40:].lower();to='0x'+ts[2][-40:].lower()
              try:v=int(lg.get('data') or '0x0',16)/(10**decimals)
              except:continue
              if to==wallet:ans+=v
              if fr==wallet:ans-=v
            return ans

          ev=[]
          for h in hashes:
            rs=byhash[h];crs=[r for r in rs if r['_pool'] in CRPOOLS]
            t,receipt,err=chain.get(h,(None,None,'missing'));wallet=((t or {}).get('from') or '').lower() or 'UNRESOLVED'
            pool_cr=sum(signed(r,CR) for r in crs);user_cr=-pool_cr
            if abs(user_cr)<1e-12:continue
            q=abs(user_cr);num=den=0.0
            for r in crs:
              z=abs(signed(r,CR));p=price(r,CR)
              if z and p:num+=z*p;den+=z
            crpx=num/den if den else 0.0
            usdc=max(wallet_delta(receipt,wallet,USDC,6),0.0) if wallet!='UNRESOLVED' else 0.0
            wron=max(wallet_delta(receipt,wallet,WRON,18),0.0) if wallet!='UNRESOLVED' else 0.0
            route_usdc=route_wron=direct_usdc=0.0;wpx=0.0
            for r in rs:
              if r['_pool'] in {'CU1','CU2'} and signed(r,USDC)<0:direct_usdc+=-signed(r,USDC)
              if r['_pool']=='MU' and signed(r,MATT)>0 and signed(r,USDC)<0:route_usdc+=-signed(r,USDC)
              if r['_pool']=='MR' and signed(r,MATT)>0 and signed(r,WRON)<0:
                route_wron+=-signed(r,WRON);wpx=price(r,WRON) or wpx
            usdc=max(usdc,direct_usdc,route_usdc);wron=max(wron,route_wron)
            direction='BUY' if user_cr>0 else 'SELL';asset='';amount=usd=0.0
            if direction=='SELL' and usdc>1e-6:asset='USDC';amount=usdc;usd=usdc
            elif direction=='SELL' and wron>1e-9:
              asset='RON/WRON';amount=wron
              if not wpx:
                for r in rs:wpx=price(r,WRON) or wpx
              usd=wron*wpx
            ev.append({'created_at':min((r.get('created_at') or '9999' for r in crs),default=''),'tx_hash':h,'wallet':wallet,'direction':direction,'crystals':q,'crystal_price_usd':crpx,'crystal_notional_usd':q*crpx,'exit_asset':asset,'exit_amount':amount,'exit_usd':usd,'owner_wallet':wallet in OWNER,'rpc_error':err})
          ev.sort(key=lambda x:(x['created_at'],x['tx_hash']))

          lots=defaultdict(deque)
          for e in ev:
            w=e['wallet']
            if e['direction']=='BUY':lots[w].append([e['crystals'],e['crystal_price_usd']]);continue
            remain=e['crystals'];cost=matched=0.0
            while remain>1e-9 and lots[w]:
              lot=lots[w][0];take=min(remain,lot[0]);cost+=take*lot[1];matched+=take;remain-=take;lot[0]-=take
              if lot[0]<=1e-9:lots[w].popleft()
            e['fifo_cost_usd']=cost;e['cost_basis_coverage']=matched/e['crystals'] if e['crystals'] else 0.0;e['unmatched_crystals']=remain
            e['realized_profit_usd']=(e['exit_usd']-cost) if e['exit_asset'] and matched>0 else None

          cash=[e for e in ev if e['direction']=='SELL' and e['exit_asset']];cash.sort(key=lambda e:e['exit_usd'],reverse=True)
          S=defaultdict(lambda:{'cashout_tx_count':0,'crystals_sold':0.0,'usdc_received':0.0,'wron_received':0.0,'exit_usd':0.0,'fifo_cost_usd':0.0,'matched':0.0,'total':0.0,'profit_known_usd':0.0,'profit_known_tx_count':0,'tx_hashes':[]})
          for e in cash:
            if e['owner_wallet']:continue
            s=S[e['wallet']];s['cashout_tx_count']+=1;s['crystals_sold']+=e['crystals'];s['exit_usd']+=e['exit_usd'];s['fifo_cost_usd']+=e.get('fifo_cost_usd',0);s['total']+=e['crystals'];s['matched']+=e['crystals']*e.get('cost_basis_coverage',0);s['tx_hashes'].append(e['tx_hash'])
            if e['exit_asset']=='USDC':s['usdc_received']+=e['exit_amount']
            else:s['wron_received']+=e['exit_amount']
            if e.get('realized_profit_usd') is not None:s['profit_known_usd']+=e['realized_profit_usd'];s['profit_known_tx_count']+=1
          sums=[]
          for w,s in S.items():
            s=dict(s);s['wallet']=w;s['cost_basis_coverage']=s.pop('matched')/s['total'] if s['total'] else 0.0;s.pop('total');sums.append(s)
          sums.sort(key=lambda s:s['exit_usd'],reverse=True)
          out={'window_utc':[datetime.fromtimestamp(START,timezone.utc).isoformat(),datetime.fromtimestamp(END,timezone.utc).isoformat()],'pool_rows':counts,'crystal_hashes':len(hashes),'rpc_resolved':sum(1 for h in hashes if chain.get(h,(None,None,''))[0]),'owner_wallets':sorted(OWNER),'wallet_summaries':sums,'cashout_events':cash,'all_crystal_events':ev}
          import os;os.makedirs('forensics-output',exist_ok=True)
          json.dump(out,open('forensics-output/crystals-forensics.json','w'),indent=2)
          F=['created_at','wallet','tx_hash','crystals','exit_asset','exit_amount','exit_usd','fifo_cost_usd','cost_basis_coverage','realized_profit_usd','owner_wallet']
          with open('forensics-output/crystals-cashouts.csv','w',newline='') as f:w=csv.DictWriter(f,fieldnames=F,extrasaction='ignore');w.writeheader();w.writerows(cash)
          SF=['wallet','cashout_tx_count','crystals_sold','usdc_received','wron_received','exit_usd','fifo_cost_usd','cost_basis_coverage','profit_known_usd','profit_known_tx_count','tx_hashes']
          with open('forensics-output/crystals-wallet-summary.csv','w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=SF,extrasaction='ignore');w.writeheader()
            for s in sums:x=dict(s);x['tx_hashes']='|'.join(x['tx_hashes']);w.writerow(x)
          print('TOP_WALLETS')
          for s in sums[:25]:print(json.dumps(s,separators=(',',':')))
          print('TOP_CASHOUTS')
          for e in [x for x in cash if not x['owner_wallet']][:40]:print(json.dumps(e,separators=(',',':')))
          PY
          python /tmp/analyze.py
      - name: Commit report to forensic branch
        shell: bash
        run: |
          git config user.name 'crystals-forensics-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add forensics-output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'forensics: record CRYSTALS launch report [skip ci]'
          git push origin HEAD:forensics/crystals-20260808
