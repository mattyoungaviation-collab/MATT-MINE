      - key: MATT_MINE_ARENA_CONTRACT_ADDRESS
        value: "0x506f969279F8264fd629BBB0Df861Ab91343b12C"
      - key: MATT_MINE_ARENA_EXPECTED_CONTRACT_ADDRESS
        value: "0x506f969279F8264fd629BBB0Df861Ab91343b12C"
      - key: MATT_MINE_ARENA_RUNTIME_CODE_HASH
        value: "0xbe675f45747d267318291cad7295374ad5c65fa06063fe3b8cc111b8fa27453a"
      - key: MATT_MINE_ARENA_MATT_ADDRESS
        value: "0xa5450417BDCa0BDfB058ffE41205400FfDA1174d"
      - key: MATT_MINE_ARENA_SAFE_ADDRESS
        value: "0xBacE355D23d378a6E1adD986E53a18Dd12E6EeAc"
      - key: MATT_MINE_ARENA_PAUSER_ADDRESS
        value: "0x57Dc8DB3a263506a0344eC15B4C623EBb8E589F4"
      - key: MATT_MINE_ARENA_DEPLOYER_ADDRESS
        value: "0xeED0491B506C78EA7fD10988B1E98A3C88e1C630"
      - key: MATT_MINE_ARENA_RECEIPT_SECRET
        generateValue: true
      - key: MATT_MINE_ARENA_SEED_SECRET
        generateValue: true
      - key: MATT_MINE_ARENA_LIVE
        value: "true"
      - key: MATT_MINE_DATABASE_POOL_SIZE
        value: "3"
      - key: MATT_MINE_DATABASE_STARTUP_RETRY_ATTEMPTS
        value: "90"
      - key: MATT_MINE_DATABASE_QUERY_RETRY_ATTEMPTS
        value: "5"
      - key: MATT_MINE_ELIGIBILITY_COUNSEL_APPROVED
        value: "true"
      - key: MATT_MINE_ELIGIBILITY_RULES_VERSION
        value: "0.01"
      - key: MATT_MINE_ELIGIBILITY_RULES_SHA256
        value: "084962441aa1291864fde13c28aaa63eebbc0b15be92cb5e3e0e4feaea6deb2e"
      - key: MATT_MINE_ELIGIBILITY_RULES_URL
        value: "/legal/matt-mine-arena-rules-v0.01.txt"
      - key: MATT_MINE_PUBLIC_PAID_MODES
        value: "arena"
      - key: MATT_MINE_ELIGIBLE_PAID_WALLETS
        sync: false

databases:
  - name: matt-mine-db
    # Wallet login and gameplay transactions rewrite the legacy JSONB state
    # while row-scoped persistence is completed. 256 MB repeatedly OOM-killed
    # PostgreSQL in production; keep the approved 1 GB capacity pinned here.
    plan: basic-1gb
    region: oregon
    databaseName: matt_mine
    user: matt_mine
