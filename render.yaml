services:
  - type: web
    name: matt-mine
    runtime: node
    # Keep the Blueprint aligned with the approved Pro 2-CPU web-service upgrade.
    # Otherwise a Blueprint sync can silently return the service to a smaller plan.
    plan: pro
    region: oregon
    buildCommand: npm ci && npm run build:walletconnect
    startCommand: npm start
    # Process liveness must not restart the web instance during a recoverable
    # PostgreSQL interruption. /api/ready remains the dependency-readiness
    # endpoint for monitoring and incident response.
    healthCheckPath: /api/live
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: MATT_MINE_TRUST_PROXY
        value: "render"
      - key: DATABASE_URL
        fromDatabase:
          name: matt-mine-db
          property: connectionString
      - key: MATT_MINE_PUBLIC_ORIGIN
        value: "https://mattmine.com"
      - key: VITE_WALLETCONNECT_PROJECT_ID
        sync: false
      - key: RONIN_RPC_URLS
        sync: false
      - key: MATT_MINE_RPC_TIMEOUT_MS
        value: "10000"
      # Activated Ronin Mainnet NFT V2 release. Private operator/signer keys
      # remain dashboard secrets; all addresses and map versions are public.
      - key: MATT_MINE_NFT_ENABLED
        value: "true"
      - key: MATT_MINE_NFT_CONTRACT_VERSION
        value: "2"
      - key: MATT_MINE_NFT_PUBLIC_BASE_URL
        value: "https://mattmine.com"
      - key: MATT_MINE_NFT_CHAIN_ID
        value: "2020"
      - key: MATT_MINE_NFT_RPC_URL
        sync: false
      - key: MATT_MINE_NFT_MINER_ADDRESS
        value: "0xBbaBE35B943E3Ba911B53C2b39447cF181fE565A"
      - key: MATT_MINE_NFT_MINER_DEPLOYMENT_BLOCK
        value: "59628599"
      - key: MATT_MINE_NFT_EQUIPMENT_ADDRESS
        value: "0x415cF1DeA47f3d4BAb830F78B82e12D6EeceD612"
      - key: MATT_MINE_NFT_EQUIPMENT_DEPLOYMENT_BLOCK
        value: "59628601"
      - key: MATT_MINE_NFT_EQUIPMENT_INDEX_CONFIRMATIONS
        value: "12"
      # Ronin RPC providers reject the 20,000-block eth_getLogs ranges that
      # were previously used by the ownership index.
      - key: MATT_MINE_NFT_EQUIPMENT_INDEX_CHUNK_SIZE
        value: "1000"
      - key: MATT_MINE_NFT_LOADOUT_ADDRESS
        value: "0xb88C219C792cFa07749E0E5D939DbbbF1E62C7b5"
      - key: MATT_MINE_NFT_CHEST_ADDRESS
        value: "0x693525e7fD76949834cad56d67D469bAAd6687F6"
      - key: MATT_MINE_NFT_SETTLEMENT_ADDRESS
        value: "0x21BEe81AdC4c87e3Ea4686DD8a38a64c8Ea5b95c"
      - key: MATT_MINE_NFT_CRYSTAL_BANK_ADDRESS
        value: "0x8C640Cd91Ea6616cDD07B8323492E76e5c9ffE78"
      - key: MATT_MINE_NFT_PASSIVE_REWARDS_ADDRESS
        value: "0xC5cf71e8000017e099fb39b24149544e1F40b0E0"
      - key: MATT_MINE_NFT_CHEST_RANDOMNESS_ADDRESS
        value: "0x74746f7853e84302255B49421A6A3AF5808c8AA6"
      - key: MATT_MINE_NFT_PASSIVE_RANDOMNESS_ADDRESS
        value: "0x652eD370383a7B5bf3c1c19e2145780bcb9A92F8"
      - key: MATT_MINE_NFT_MAP_VERSIONS_JSON
        value: '{"arena":"0x5fa5b85dfd9794c50d1de87c83b8cc2b28e4c454c4d64ce7280876984fd526f0","paid":"0x4d86497b3e3385412a206bebed747aa621db1d38766608d19e69f2eb7185385c"}'
      - key: MATT_MINE_NFT_GAMEPLAY_ENABLED
        sync: false
      - key: MATT_MINE_NFT_GAME_OPERATOR_ADDRESS
        value: "0x112C8a89bfAb3f19D7ceADf7433Fd8D253cFe4D3"
      - key: MATT_MINE_NFT_REWARD_SIGNER_ADDRESS
        value: "0x61FC35192964Fa4b50D915261419e9D2Ba369708"
      - key: MATT_MINE_NFT_GAME_OPERATOR_PRIVATE_KEY
        sync: false
      - key: MATT_MINE_NFT_REWARD_SIGNER_PRIVATE_KEY
        sync: false
      # Enabled only after exact source verification, green release checks,
      # and explicit Ronin activation. The remaining values are public.
      - key: MATT_MINE_ENDLESS_SETTLEMENT_ENABLED
        value: "true"
      - key: MATT_MINE_ENDLESS_SETTLEMENT_ADDRESS
        value: "0x5025AA32077569c38a2380E4d14DB024f6e55ECf"
      - key: MATT_MINE_ENDLESS_DEPLOYMENT_BLOCK
        value: "60167705"
      - key: MATT_MINE_ENDLESS_VERSION_IDS_JSON
