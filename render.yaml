      - key: MATT_MINE_NFT_CONFIG_OPERATOR_PRIVATE_KEY
        sync: false
      - key: MATT_MINE_ADMIN_WALLETS
        sync: false
      - key: MATT_MINE_ADMIN_KEY
        generateValue: true
      - key: MATT_MINE_REWARD_APPROVER_KEY
        generateValue: true
      - key: MATT_MINE_REWARD_PUBLISHING_ENABLED
        value: "true"
      - key: MATT_MINE_REWARD_MAX_BOARD_MATT
        value: "5000000"
      - key: MATT_MINE_MAINNET_TRANSACTIONS_ENABLED
        value: "true"
      - key: MATT_MINE_PAYMENT_CONFIRMATIONS
        value: "3"
      - key: MATT_MINE_COMPETITIVE_REPLAY_SECRET
        generateValue: true
      - key: MATT_MINE_REVIVE_PAYMENTS_ENABLED
        value: "true"
      - key: MATT_MINE_REVIVE_RECIPIENT_ADDRESS
        value: "0xBacE355D23d378a6E1adD986E53a18Dd12E6EeAc"
      - key: MATT_MINE_ADVERTISEMENT_REWARDS_ENABLED
