services:
  - type: web
    name: matt-mine
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: matt-mine-db
          property: connectionString
      - key: MATT_MINE_PUBLIC_ORIGIN
        sync: false
      - key: MATT_MINE_ADMIN_KEY
        generateValue: true
      - key: MATT_MINE_REWARD_APPROVER_KEY
        generateValue: true
      - key: MATT_MINE_REWARD_PUBLISHING_ENABLED
        value: "false"
      - key: MATT_MINE_REWARD_MAX_BOARD_MATT
        value: "100000"
      - key: MATT_MINE_MAINNET_TRANSACTIONS_ENABLED
        value: "true"
      - key: MATT_MINE_PAYMENT_CONFIRMATIONS
        value: "3"
      - key: MATT_MINE_DATABASE_POOL_SIZE
        value: "10"

databases:
  - name: matt-mine-db
    plan: basic-256mb
    region: oregon
    databaseName: matt_mine
    user: matt_mine
