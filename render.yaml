services:
  - type: web
    name: matt-mine
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: matt-mine-db
          property: connectionString
      - key: MATT_MINE_PUBLIC_ORIGIN
        sync: false
      - key: MATT_MINE_ADMIN_KEY
        generateValue: true
      - key: MATT_MINE_REWARD_APPROVER_KEY
        generateValue: true
      - key: MATT_MINE_REWARD_PUBLISHING_ENABLED
        value: "true"
      - key: MATT_MINE_REWARD_MAX_BOARD_MATT
        value: "5000000"
      - key: MATT_MINE_MAINNET_TRANSACTIONS_ENABLED
        value: "true"
      - key: MATT_MINE_PAYMENT_CONFIRMATIONS
        value: "3"
      - key: MATT_MINE_ARENA_CONTRACT_ADDRESS
        value: "0x506f969279F8264fd629BBB0Df861Ab91343b12C"
      - key: MATT_MINE_ARENA_EXPECTED_CONTRACT_ADDRESS
        value: "0x506f969279F8264fd629BBB0Df861Ab91343b12C"
      - key: MATT_MINE_ARENA_RUNTIME_CODE_HASH
        value: "0xbe675f45747d267318291cad7295374ad5c65fa06063fe3b8cc111b8fa27453a"
      - key: MATT_MINE_ARENA_MATT_ADDRESS
        value: "0xa5450417BDCa0BDfB058ffE41205400FfDA1174d"
      - key: MATT_MINE_ARENA_SAFE_ADDRESS
        value: "0xBacE355D23d378a6E1adD986E53a18Dd12E6EeAc"
      - key: MATT_MINE_ARENA_PAUSER_ADDRESS
        value: "0x57Dc8DB3a263506a0344eC15B4C623EBb8E589F4"
      - key: MATT_MINE_ARENA_DEPLOYER_ADDRESS
        value: "0xeED0491B506C78EA7fD10988B1E98A3C88e1C630"
      - key: MATT_MINE_ARENA_RECEIPT_SECRET
        generateValue: true
      - key: MATT_MINE_ARENA_SEED_SECRET
        generateValue: true
      - key: MATT_MINE_ARENA_LIVE
        value: "false"
      - key: MATT_MINE_DATABASE_POOL_SIZE
        value: "10"

databases:
  - name: matt-mine-db
    plan: basic-256mb
    region: oregon
    databaseName: matt_mine
    user: matt_mine
