services:
  - type: web
    name: matt-mine
    runtime: node
    # Keep the Blueprint aligned with the approved Pro 2-CPU web-service upgrade.
    # Otherwise a Blueprint sync can silently return the service to a smaller plan.
    plan: pro
    region: oregon
    buildCommand: npm ci && npm run build:walletconnect
    startCommand: npm start
    # Process liveness must not restart the web instance during a recoverable
    # PostgreSQL interruption. /api/ready remains the dependency-readiness
    # endpoint for monitoring and incident response.
    healthCheckPath: /api/live
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: matt-mine-db
          property: connectionString
      - key: MATT_MINE_PUBLIC_ORIGIN
        sync: false
      - key: VITE_WALLETCONNECT_PROJECT_ID
        sync: false
      - key: RONIN_RPC_URLS
        sync: false
      - key: MATT_MINE_RPC_TIMEOUT_MS
        value: "10000"
      # NFT V2 addresses are populated from the verified deployment manifest.
      # Gameplay remains disabled until roles are separated and every module is checked.
      - key: MATT_MINE_NFT_ENABLED
        value: "false"
      - key: MATT_MINE_NFT_CONTRACT_VERSION
        value: "2"
      - key: MATT_MINE_NFT_PUBLIC_BASE_URL
        value: "https://matt-mine.onrender.com"
      - key: MATT_MINE_NFT_CHAIN_ID
        value: "2020"
      - key: MATT_MINE_NFT_RPC_URL
        value: "https://api.roninchain.com/rpc"
      - key: MATT_MINE_NFT_MINER_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_EQUIPMENT_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_LOADOUT_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_CHEST_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_SETTLEMENT_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_CRYSTAL_BANK_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_PASSIVE_REWARDS_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_CHEST_RANDOMNESS_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_PASSIVE_RANDOMNESS_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_MAP_VERSIONS_JSON
        sync: false
      - key: MATT_MINE_NFT_GAMEPLAY_ENABLED
        sync: false
      - key: MATT_MINE_NFT_GAME_OPERATOR_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_REWARD_SIGNER_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_GAME_OPERATOR_PRIVATE_KEY
        sync: false
      - key: MATT_MINE_NFT_REWARD_SIGNER_PRIVATE_KEY
        sync: false
      - key: MATT_MINE_NFT_ADMIN_CONTROLS_ENABLED
        value: "false"
      - key: MATT_MINE_NFT_CONFIG_OPERATOR_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_CONFIG_OPERATOR_PRIVATE_KEY
        sync: false
      - key: MATT_MINE_ADMIN_WALLETS
        sync: false
      - key: MATT_MINE_ADMIN_KEY
        generateValue: true
      - key: MATT_MINE_REWARD_APPROVER_KEY
        generateValue: true
      - key: MATT_MINE_REWARD_PUBLISHING_ENABLED
        value: "true"
      - key: MATT_MINE_REWARD_MAX_BOARD_MATT
        value: "5000000"
      - key: MATT_MINE_MAINNET_TRANSACTIONS_ENABLED
