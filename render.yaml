services:
  - type: web
    name: matt-mine
    runtime: node
    # Keep the Blueprint aligned with the approved Pro 2-CPU web-service upgrade.
    # Otherwise a Blueprint sync can silently return the service to a smaller plan.
    plan: pro
    region: oregon
    buildCommand: npm ci && npm run build:walletconnect
    startCommand: npm start
    # Process liveness must not restart the web instance during a recoverable
    # PostgreSQL interruption. /api/ready remains the dependency-readiness
    # endpoint for monitoring and incident response.
    healthCheckPath: /api/live
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: matt-mine-db
          property: connectionString
      - key: MATT_MINE_PUBLIC_ORIGIN
        sync: false
      - key: VITE_WALLETCONNECT_PROJECT_ID
        sync: false
      - key: RONIN_RPC_URLS
        sync: false
      - key: MATT_MINE_RPC_TIMEOUT_MS
        value: "10000"
      # NFT metadata reads the isolated Saigon rehearsal contracts. This does
      # not change the main game's Ronin Mainnet authentication or payments.
      - key: MATT_MINE_NFT_ENABLED
        value: "true"
      - key: MATT_MINE_NFT_PUBLIC_BASE_URL
        value: "https://matt-mine.onrender.com"
      - key: MATT_MINE_NFT_CHAIN_ID
        value: "202601"
      - key: MATT_MINE_NFT_RPC_URL
        value: "https://saigon-testnet.roninchain.com/rpc"
      - key: MATT_MINE_NFT_MINER_ADDRESS
        value: "0x545d5d4c714eB4d2242BBFE82C31fe9a1E5Cff29"
      - key: MATT_MINE_NFT_EQUIPMENT_ADDRESS
        value: "0x73A4Ad9a2b4bfeeE1b98F5D99AaB24B702dEb093"
      - key: MATT_MINE_NFT_LOADOUT_ADDRESS
        value: "0x6cf168cdD198D0d111faE2286aE6dcD86FA960d8"
      - key: MATT_MINE_NFT_CHEST_ADDRESS
        value: "0x52f66358ae951638a794777F3cc3448513d5be37"
      - key: MATT_MINE_NFT_SETTLEMENT_ADDRESS
        value: "0x08d6FE054A75a59b7Abd4942D890f56f8e1896B2"
      - key: MATT_MINE_NFT_REDEMPTION_ADDRESS
        value: "0xc06b131C160701150Cea5b2C22dB3c6d7f451309"
      - key: MATT_MINE_NFT_RANDOMNESS_ADDRESS
        value: "0x13B2CC4744657bbc75a1f7588A1Ca8e397E69521"
      - key: MATT_MINE_NFT_GAMEPLAY_ENABLED
        sync: false
      - key: MATT_MINE_NFT_CRYSTAL_CARRY_LIMIT
        value: "10"
      - key: MATT_MINE_NFT_GAME_OPERATOR_ADDRESS
        value: "0x112C8a89bfAb3f19D7ceADf7433Fd8D253cFe4D3"
      - key: MATT_MINE_NFT_GAME_SIGNER_ADDRESS
        value: "0x61FC35192964Fa4b50D915261419e9D2Ba369708"
      - key: MATT_MINE_NFT_GAME_OPERATOR_PRIVATE_KEY
        sync: false
      - key: MATT_MINE_NFT_GAME_SIGNER_PRIVATE_KEY
        sync: false
      # Saigon-only keeper. Enable only after its dedicated address and private
      # key are stored in Render; 0xF799 retains contract ownership.
      - key: MATT_MINE_NFT_SAIGON_KEEPER_ENABLED
        value: "false"
      - key: MATT_MINE_NFT_SAIGON_KEEPER_POLL_MS
        value: "5000"
      - key: MATT_MINE_NFT_SAIGON_KEEPER_ADDRESS
        sync: false
      - key: MATT_MINE_NFT_SAIGON_KEEPER_PRIVATE_KEY
        sync: false
      - key: MATT_MINE_ADMIN_WALLETS
        sync: false
      - key: MATT_MINE_ADMIN_KEY
        generateValue: true
      - key: MATT_MINE_REWARD_APPROVER_KEY
        generateValue: true
      - key: MATT_MINE_REWARD_PUBLISHING_ENABLED
        value: "true"
      - key: MATT_MINE_REWARD_MAX_BOARD_MATT
        value: "5000000"
      - key: MATT_MINE_MAINNET_TRANSACTIONS_ENABLED
        value: "true"
      - key: MATT_MINE_PAYMENT_CONFIRMATIONS
        value: "3"
      - key: MATT_MINE_COMPETITIVE_REPLAY_SECRET
        generateValue: true
      - key: MATT_MINE_REVIVE_PAYMENTS_ENABLED
        value: "true"
      - key: MATT_MINE_REVIVE_RECIPIENT_ADDRESS
        value: "0xBacE355D23d378a6E1adD986E53a18Dd12E6EeAc"
      - key: MATT_MINE_ADVERTISEMENT_REWARDS_ENABLED
        value: "false"
      - key: MATT_MINE_ARENA_CONTRACT_ADDRESS
        value: "0x506f969279F8264fd629BBB0Df861Ab91343b12C"
      - key: MATT_MINE_ARENA_EXPECTED_CONTRACT_ADDRESS
        value: "0x506f969279F8264fd629BBB0Df861Ab91343b12C"
      - key: MATT_MINE_ARENA_RUNTIME_CODE_HASH
        value: "0xbe675f45747d267318291cad7295374ad5c65fa06063fe3b8cc111b8fa27453a"
      - key: MATT_MINE_ARENA_MATT_ADDRESS
        value: "0xa5450417BDCa0BDfB058ffE41205400FfDA1174d"
      - key: MATT_MINE_ARENA_SAFE_ADDRESS
        value: "0xBacE355D23d378a6E1adD986E53a18Dd12E6EeAc"
      - key: MATT_MINE_ARENA_PAUSER_ADDRESS
        value: "0x57Dc8DB3a263506a0344eC15B4C623EBb8E589F4"
      - key: MATT_MINE_ARENA_DEPLOYER_ADDRESS
        value: "0xeED0491B506C78EA7fD10988B1E98A3C88e1C630"
      - key: MATT_MINE_ARENA_RECEIPT_SECRET
        generateValue: true
      - key: MATT_MINE_ARENA_SEED_SECRET
        generateValue: true
      - key: MATT_MINE_ARENA_LIVE
        value: "true"
      - key: MATT_MINE_DATABASE_POOL_SIZE
        value: "3"
      - key: MATT_MINE_DATABASE_STARTUP_RETRY_ATTEMPTS
        value: "90"
      - key: MATT_MINE_DATABASE_QUERY_RETRY_ATTEMPTS
        value: "5"
      - key: MATT_MINE_ELIGIBILITY_COUNSEL_APPROVED
        value: "true"
      - key: MATT_MINE_ELIGIBILITY_RULES_VERSION
        value: "0.01"
      - key: MATT_MINE_ELIGIBILITY_RULES_SHA256
        value: "084962441aa1291864fde13c28aaa63eebbc0b15be92cb5e3e0e4feaea6deb2e"
      - key: MATT_MINE_ELIGIBILITY_RULES_URL
        value: "/legal/matt-mine-arena-rules-v0.01.txt"
      - key: MATT_MINE_PUBLIC_PAID_MODES
        value: "arena"
      - key: MATT_MINE_ELIGIBLE_PAID_WALLETS
        sync: false

databases:
  - name: matt-mine-db
    # Wallet login and gameplay transactions rewrite the legacy JSONB state
    # while row-scoped persistence is completed. 256 MB repeatedly OOM-killed
    # PostgreSQL in production; keep the approved 1 GB capacity pinned here.
    plan: basic-1gb
    region: oregon
    databaseName: matt_mine
    user: matt_mine
